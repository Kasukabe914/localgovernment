name: Monitor production search health

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-health:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check production search health
        env:
          FETCH_BASE_URL: https://www.amalgamator.nz
          HEALTHCHECK_RETRIES: 3
          HEALTHCHECK_RETRY_DELAY_MS: 10000
          INDEXNOW_KEY: b583a9fc76f0257dc9b89f70fffaac88
        run: node scripts/post-deploy-checks.mjs

      - name: Surface a production alert
        if: failure()
        run: echo "::error title=Production search-health alert::robots.txt, sitemap.xml, a canonical page, structured data, the IndexNow key, or the 67-row council directory has failed validation."
